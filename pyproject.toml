[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rootline"
version = "0.1.0"
description = "Root-cause analysis for failed GitHub Actions runs, powered by Claude. Posts an explanation and suggested fix as a PR comment."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hasan Çelik" }]
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.13,<2",
  "requests>=2.31",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rootline = "rootline.cli:main"

[project.urls]
Homepage = "https://hasancelik.com.tr"
Source = "https://github.com/rootline-dev-ops/rootline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
